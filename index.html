<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>HorsePlay</title>
<!--
  HorsePlay. moves.json is loaded with fetch(), so serve this folder over HTTP
  (e.g. `python3 -m http.server`), not file://.
  Clips use a plain <iframe>; set moveStart / moveEnd (seconds) in moves.json to trim each clip.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Geist:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --card:#121110; --raise:#1b1a18; --line:#2c2a28;
  --ink:#fff; --muted:#8f8b86; --red:#ff0040; --green:#3dbe5a;
  --display:"Boldonse",Impact,"Arial Black",sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;flex:1}

header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
header img{height:34px;width:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.iconbtn{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.iconbtn svg{width:28px;height:28px}
.badge{position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.count{align-self:flex-end;font-size:.8rem;color:var(--muted);font-weight:500;margin:0 8px 8px;min-height:1em}

.stage{perspective:1200px;margin-bottom:62px}
.card{position:relative;background:var(--card);border-radius:28px;padding:18px 16px 66px}
.face{transition:transform .2s ease-in,opacity .2s;transform-origin:center}
.face.out{transform:rotateY(90deg);opacity:0}
.face.in{animation:flipin .22s ease-out}
@keyframes flipin{from{transform:rotateY(-90deg);opacity:0}to{transform:none;opacity:1}}

.pill{display:flex;align-items:center;gap:12px;width:max-content;margin:0 auto 16px;background:#000;border-radius:999px;padding:9px 18px}
.pill b{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.balls{display:flex;gap:8px}
.balls svg{width:22px;height:22px;color:var(--red)}
.balls svg.off{opacity:.22}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;line-height:1.35;text-align:center;margin:0 0 12px;text-wrap:balance}
.desc{font-style:italic;color:var(--muted);text-align:center;font-size:1rem;line-height:1.45;margin:0 auto 16px;max-width:36ch}

.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt{display:block;text-align:center;color:var(--muted);font-size:.85rem;margin-top:10px;text-decoration:underline}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-weight:800;border-radius:999px;padding:12px 22px;font-size:1rem}
.empty{display:none;text-align:center;padding:26px 8px 12px}
.empty p{color:var(--muted);line-height:1.5;margin:0 auto 20px;max-width:32ch}
.card.done .face > :not(.empty){display:none}
.card.done .empty{display:block}
.card.done .actions{display:none}
.card.done{padding-bottom:28px}
.card.done + * {}

.actions{position:absolute;left:0;right:0;bottom:-44px;display:flex;justify-content:center;gap:16px;padding:0 12px}
.act{width:min(46%,168px);height:96px;border-radius:44px;background:#000;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-weight:800;font-size:1.25rem;letter-spacing:-.03em;text-transform:uppercase;transition:transform .12s}
.act:active{transform:scale(.96)}
.act svg{width:34px;height:34px}
.act.made{border-color:var(--green);color:var(--ink);box-shadow:0 18px 44px -6px rgba(61,190,90,.55)}
.act.made svg{color:var(--green)}
.act.miss{border-color:var(--red);box-shadow:0 18px 44px -6px rgba(255,0,64,.55)}
.horse{width:36px;height:29px;background:url(horseplaylogo.png) -95px -5px/195px auto no-repeat}

footer{margin-top:auto;display:flex;justify-content:center;padding-top:22px}
.share{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:.95rem;padding:12px 18px;border-radius:999px;border:1px solid var(--line)}
.share svg{width:18px;height:18px}

.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.panel{position:absolute;left:50%;bottom:0;width:100%;max-width:480px;transform:translateX(-50%);background:var(--card);border-radius:28px 28px 0 0;
  padding:22px 20px max(22px,env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.panel h3{font-family:var(--display);font-weight:400;font-size:1.05rem;margin:0 0 20px}
.lbl{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.chips{display:flex;gap:10px;margin-bottom:24px}
.chip{flex:1;height:48px;border-radius:999px;border:2px solid var(--line);font-weight:700}
.chip[aria-pressed=true]{border-color:var(--red);background:rgba(255,0,64,.14)}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;height:56px;font-weight:700;font-size:1.05rem;margin-bottom:12px}
.sw{width:54px;height:32px;border-radius:999px;background:#3a3836;position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-checked=true] .sw{background:var(--red)}
.tog[aria-checked=true] .sw::after{transform:translateX(22px)}
.panel .btn{width:100%;height:54px;font-size:1.05rem}
.found{color:var(--muted);font-size:.9rem;text-align:center;margin:0 0 12px}

.toast{position:fixed;left:50%;bottom:max(90px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--raise);padding:12px 20px;border-radius:999px;
  font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .face,.face.in,.panel,.act,.toast{transition:none;animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="horseplaylogo.png" alt="">
    <h1 class="sr">HorsePlay</h1>
    <button class="iconbtn" id="filterBtn" aria-label="Filter moves" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      <span class="badge" id="badge" hidden></span>
    </button>
  </header>

  <div class="count" id="counter" aria-live="polite"></div>

  <div class="stage">
    <section class="card" id="card">
      <div class="face" id="face">
        <div class="pill"><b id="tier"></b><span class="balls" id="balls" aria-hidden="true"></span></div>
        <h2 id="name"></h2>
        <p class="desc" id="desc"></p>

        <div class="frame" id="frame">
          <iframe id="clip" width="560" height="315" src="about:blank" title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <a class="yt" id="ytLink" target="_blank" rel="noopener">Not loading? Watch on YouTube</a>

        <div class="empty" id="empty">
          <h2 id="eTitle"></h2><p id="eText"></p>
          <button class="btn" id="eBtn"></button>
        </div>
      </div>

      <div class="actions">
        <button class="act made" id="made"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5c.6 3.6 5.5 5.6 5.5 10.6a5.5 5.5 0 0 1-11 0c0-2.2 1-3.8 2.4-5 .2 1.6.9 2.5 2 2.9C10.4 8.4 10.7 5.2 12 2.5z"/></svg>Made it!</button>
        <button class="act miss" id="miss"><span class="horse" aria-hidden="true"></span>Missed</button>
      </div>
    </section>
  </div>

  <footer>
    <button class="share" id="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l7 6-7 6v-3.5C8.5 12.5 5 14 3 19c.5-6 4-10 11-10.5z"/></svg>Share</button>
  </footer>
</div>

<div class="sheet" id="sheet">
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle">Filter moves</h3>
    <p class="lbl">Difficulty</p>
    <div class="chips" id="chips">
      <button class="chip" data-t="easy" aria-pressed="true">Easy</button>
      <button class="chip" data-t="medium" aria-pressed="true">Medium</button>
      <button class="chip" data-t="hard" aria-pressed="true">Hard</button>
    </div>
    <button class="tog" id="dunkTog" role="switch" aria-checked="true">Include dunks<span class="sw"></span></button>
    <p class="found" id="found"></p>
    <button class="btn" id="apply">Apply</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const CFG = { PAD_BEFORE: 2, PAD_AFTER: 2 };
  const TIERS = { easy: 'Rookie', medium: 'Starter', hard: 'All-Star' };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const BALL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 2.5v19M2.5 12h19M5.2 5.2c3.5 3.5 3.5 9.1 0 13.6M18.8 5.2c-3.5 3.5-3.5 9.1 0 13.6"/></svg>';

  let all = [], deck = [], idx = 0, tally = { made: 0, missed: 0 };
  let win = { start: 0, end: null }, cur = null;
  let filt = loadFilters(), draft = null;

  /* ---------- filters ---------- */
  function loadFilters() {
    try {
      const f = JSON.parse(localStorage.getItem('hp-filters'));
      if (f && Array.isArray(f.tiers)) return { tiers: f.tiers, dunk: !!f.dunk };
    } catch (e) {}
    return { tiers: ['easy', 'medium', 'hard'], dunk: true };
  }
  const saveFilters = () => { try { localStorage.setItem('hp-filters', JSON.stringify(filt)); } catch (e) {} };
  const matches = (m, f) => f.tiers.includes(m.tier) && (f.dunk || !m.dunk);
  const isDefault = () => filt.tiers.length === 3 && filt.dunk;
  const shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.random() * (k + 1) | 0; [a[k], a[j]] = [a[j], a[k]]; } return a; };

  /* ---------- clip window + plain iframe ---------- */
  function clipWindow(m) {
    if (m.moveStart == null || m.moveEnd == null) return { start: 0, end: null };
    return {
      start: Math.max(0, m.moveStart - (m.padBefore ?? CFG.PAD_BEFORE)),
      end: m.moveEnd + (m.padAfter ?? CFG.PAD_AFTER)
    };
  }
  // Each new move just swaps the iframe URL: https://www.youtube.com/embed/VIDEO_ID
  // Start/end are only added once a move has moveStart/moveEnd (whole seconds, padded).
  function loadClip(m) {
    cur = m; win = clipWindow(m);
    let url = `https://www.youtube.com/embed/${m.videoId}`;
    if (win.end != null) url += `?start=${Math.floor(win.start)}&end=${Math.ceil(win.end)}`;
    $('#clip').src = url;
    $('#ytLink').href = `https://www.youtube.com/watch?v=${m.videoId}&t=${Math.floor(win.start)}s`;
  }

  /* ---------- deck ---------- */
  function buildDeck() {
    deck = shuffle(all.filter(m => matches(m, filt)));
    idx = 0; tally = { made: 0, missed: 0 };
    $('#badge').hidden = isDefault();
    show();
  }
  function show() {
    const card = $('#card');
    if (!deck.length) return endPanel('No moves match these filters', 'Turn on more difficulties or include dunks to see moves.', 'Reset filters', () => {
      filt = { tiers: ['easy', 'medium', 'hard'], dunk: true }; saveFilters(); buildDeck();
    });
    if (idx >= deck.length) return endPanel('Deck complete', `${tally.made} made, ${tally.missed} missed. Ready for another round?`, 'Shuffle and restart', buildDeck);
    card.classList.remove('done');
    const m = deck[idx];
    $('#tier').textContent = TIERS[m.tier];
    $('#balls').innerHTML = Array.from({ length: 5 }, (_, k) => BALL.replace('<svg', `<svg class="${k < m.level ? '' : 'off'}"`)).join('');
    $('#name').textContent = m.name;
    $('#desc').textContent = m.description;
    $('#counter').textContent = `${idx + 1} / ${deck.length}`;
    loadClip(m);
  }
  function endPanel(title, text, label, fn) {
    $('#card').classList.add('done');
    $('#eTitle').textContent = title; $('#eText').textContent = text; $('#eBtn').textContent = label;
    $('#eBtn').onclick = fn; $('#counter').textContent = '';
    cur = null; $('#clip').src = 'about:blank';
  }
  function go(n) {
    const next = idx + n;
    if (next < 0 || next > deck.length || !deck.length || idx >= deck.length && n > 0) return;
    const face = $('#face');
    const swap = () => { idx = next; show(); };
    if (reduce) return swap();
    face.classList.add('out');
    setTimeout(() => { swap(); face.classList.remove('out'); face.classList.add('in'); setTimeout(() => face.classList.remove('in'), 240); }, 200);
  }
  $('#made').onclick = () => { tally.made++; go(1); };
  $('#miss').onclick = () => { tally.missed++; go(1); };
  document.addEventListener('keydown', e => {
    if ($('#sheet').classList.contains('open')) return;
    if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
  });
  let sx = null;
  const stage = $('.stage');
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
  });

  /* ---------- filter sheet ---------- */
  const sheet = $('#sheet');
  function paintSheet() {
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', draft.tiers.includes(c.dataset.t)));
    $('#dunkTog').setAttribute('aria-checked', draft.dunk);
    const n = all.filter(m => matches(m, draft)).length;
    $('#found').textContent = `${n} ${n === 1 ? 'move matches' : 'moves match'}`;
    $('#apply').disabled = n === 0; $('#apply').style.opacity = n ? 1 : .4;
  }
  function openSheet() {
    draft = { tiers: [...filt.tiers], dunk: filt.dunk }; paintSheet();
    sheet.classList.add('open'); $('.chip').focus();
  }
  function closeSheet() { sheet.classList.remove('open'); $('#filterBtn').focus(); }
  $('#filterBtn').onclick = openSheet;
  $('#scrim').onclick = closeSheet;
  $('#chips').onclick = e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const t = c.dataset.t;
    draft.tiers = draft.tiers.includes(t) ? draft.tiers.filter(x => x !== t) : [...draft.tiers, t];
    paintSheet();
  };
  $('#dunkTog').onclick = () => { draft.dunk = !draft.dunk; paintSheet(); };
  $('#apply').onclick = () => { filt = draft; saveFilters(); closeSheet(); buildDeck(); };
  sheet.addEventListener('keydown', e => {
    if (e.key === 'Escape') return closeSheet();
    if (e.key !== 'Tab') return;
    const f = [...sheet.querySelectorAll('button:not(:disabled)')];
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  /* ---------- share ---------- */
  function toast(t) {
    const el = $('#toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800);
  }
  $('#share').onclick = async () => {
    const data = { title: 'HorsePlay', text: 'Can you hit these NBA moves?', url: location.href.split('?')[0] };
    try {
      if (navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(data.url); toast('Link copied'); }
    } catch (e) {
      if (e.name !== 'AbortError') { try { await navigator.clipboard.writeText(data.url); toast('Link copied'); } catch (_) { toast('Copy the link from your address bar'); } }
    }
  };

  /* ---------- boot ---------- */
  fetch('moves.json')
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { all = d; buildDeck(); })
    .catch(() => endPanel('Couldn’t load moves', 'Serve this folder over HTTP (for example, run python3 -m http.server) instead of opening the file directly.', 'Try again', () => location.reload()));
})();
</script>
</body>
</html>
